[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-to-agent-course"
version = "1.4.0rc1"
description = "Zero to Agent: a local document helper, bounded watcher, local model lab, front desk, and evidence workbook"
requires-python = ">=3.12,<3.14"
dependencies = ["streamlit>=1.49,<2", "httpx>=0.28,<1", "pypdf>=6,<7"]

[project.scripts]
zta = "zta.cli:main"

[tool.setuptools.packages.find]
where = ["projects/zta/src"]

[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "reportlab>=4,<5", "markdown>=3.7,<4"]

[tool.pytest.ini_options]
testpaths = ["projects/zta/tests", "projects/watchman/tests", "projects/local-models/tests", "projects/front-desk/tests"]
