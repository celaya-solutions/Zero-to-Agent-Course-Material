name: Project Lab Watchman

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      WATCH_URL: "REPLACE WITH THE PUBLIC ADDRESS OF practice-page.html"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the watchman
        run: python watch.py
      - name: Save the logbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .watch-state
          git diff --cached --quiet || git commit -m "Record watchman round"
          git push

# GitHub schedules use UTC. This example is 13:00 UTC, about 6 a.m. MST and
# 7 a.m. MDT in El Paso. Review it when daylight-saving time changes.
