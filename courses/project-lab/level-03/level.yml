number: 3
title: "Nothing Leaves the Building"
objective: "Run a local model with external network links disconnected, compare two models using the same prompts, verify one answer, and test a named model with a missing-information rule."
prerequisites:
  - "Your own Ollama-capable Windows or Mac computer and the shared course setup"
  - "Level 3 preparation completed online before class, including both model downloads where hardware allows"
  - "Level 2 proof or an honestly labeled catch-up route"
passing_proof: "An observed offline answer or a labeled fallback; six benchmark rows with model identity, size, total time, and your quality verdict; one checked source; a named model tested before and after one rule edit; and a written local-versus-cloud choice."
required_project_milestone: "The model is a file."
core_route: "Use the local lab, compare Gemma 3 1B and 4B, check the supplied source, and revise one named writing rule."
builder_extension: "Compare a second round on the same machine; keep the endpoint on localhost and explain run-to-run variation."
