<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360"><rect width="1100" height="360" fill="#f6f2e9"/><g font-family="Arial" fill="#19392e"><text x="32" y="45" font-size="26">From your fork to your first answer</text><text x="32" y="75" font-size="15">Instructional map - Windows and Mac use the same project commands</text></g><g fill="#e7e9dd" stroke="#456c59"><rect x="30" y="105" width="240" height="170"/><rect x="295" y="105" width="240" height="170"/><rect x="560" y="105" width="240" height="170"/><rect x="825" y="105" width="245" height="170"/></g><g font-family="Arial" fill="#19392e" font-size="18"><text x="45" y="140">1. Browser</text><text x="45" y="180">Create your GitHub fork</text><text x="310" y="140">2. GitHub Desktop</text><text x="310" y="180">Clone YOUR fork</text><text x="575" y="140">3. Terminal in clone</text><text x="575" y="180">uv sync --frozen</text><text x="575" y="210">setup / doctor / start</text><text x="840" y="140">4. Local browser</text><text x="840" y="180">127.0.0.1:8501</text><text x="840" y="210">Load binder; build index</text></g><g font-family="Arial" font-size="15" fill="#19392e"><text x="32" y="320">Keys and learner evidence stay in .zta/. Publish your code change; upload evidence privately to the course.</text></g></svg>