# Install with: uv run --frozen zta prepare watchman
# No workflow is installed or enabled in the canonical course repository.
name: Project Lab Watchman

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *" # Daily at 13:17 UTC; may be delayed or dropped.

permissions: {}
concurrency:
  group: project-lab-watchman
  cancel-in-progress: false

jobs:
  watch:
    if: vars.WATCHMAN_ENABLED == 'true' && github.repository != 'celaya-solutions/Zero-to-Agent-Course-Material'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Only the state file is written by this code; token scope is repository-wide.
      issues: write # Creates the explicitly allowed practice issue in this fork.
    env:
      WATCH_BRANCH: ${{ github.event.repository.default_branch }}
      WATCHMAN_ENABLED: ${{ vars.WATCHMAN_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look, compare, tell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python projects/watchman/watch.py --github
      - name: Keep the round receipt, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchman-${{ github.run_id }}-${{ github.run_attempt }}
          path: .zta/watchman-run/rounds.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
